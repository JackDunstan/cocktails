<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="robots" content="noindex, nofollow">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cocktails — Jack Dunstan</title>
  <meta property="og:title" content="Cocktails">
  <meta property="og:description" content="Jack's cocktail library matched to bar inventory.">
  <meta property="og:type" content="website">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body { background: #0d0d0d; color: #e8e8e8; min-height: 100vh; }

    /* Navbar */
    .navbar { background: #111 !important; border-bottom: 1px solid #222; }
    .navbar-brand, .navbar-text { color: #e8e8e8 !important; }
    .form-control {
      background: #1a1a1a;
      border-color: #333;
      color: #e8e8e8;
    }
    .form-control:focus {
      background: #1a1a1a;
      border-color: #555;
      color: #e8e8e8;
      box-shadow: none;
    }
    .form-control::placeholder { color: #555; }

    /* Filter bar */
    .filter-bar {
      background: #111;
      border-bottom: 1px solid #222;
      gap: 0.4rem;
    }
    .btn-filter-active {
      background: #c8a96e !important;
      border-color: #c8a96e !important;
      color: #111 !important;
    }
    .btn-filter {
      border-color: #333;
      color: #999;
      background: transparent;
      font-size: 0.8rem;
    }
    .btn-filter:hover { border-color: #c8a96e; color: #c8a96e; background: transparent; }
    .count-badge { font-size: 0.75rem; color: #555; }

    /* Cards */
    .cocktail-card {
      background: #161616;
      border: 1px solid #222 !important;
      cursor: pointer;
      transition: transform 0.15s, border-color 0.15s, box-shadow 0.15s;
      height: 100%;
    }
    .cocktail-card:hover {
      transform: translateY(-2px);
      border-color: #c8a96e !important;
      box-shadow: 0 4px 20px rgba(200,169,110,0.12) !important;
    }
    .cocktail-card.unavailable {
      opacity: 0.4;
      cursor: default;
    }
    .cocktail-card.unavailable:hover {
      transform: none;
      border-color: #222 !important;
      box-shadow: none !important;
    }
    .card-body { padding: 0.85rem; }
    .card-title { font-size: 0.95rem; font-weight: 600; color: #e8e8e8; line-height: 1.3; margin-bottom: 0.3rem; }
    .card-meta { font-size: 0.7rem; color: #666; text-transform: uppercase; letter-spacing: 0.06em; }
    .badge-available {
      font-size: 0.6rem;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      background: rgba(200,169,110,0.15);
      color: #c8a96e;
      border: 1px solid rgba(200,169,110,0.3);
      padding: 0.15rem 0.4rem;
    }
    .badge-missing {
      font-size: 0.6rem;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      background: rgba(180,60,60,0.15);
      color: #b44;
      border: 1px solid rgba(180,60,60,0.3);
      padding: 0.15rem 0.4rem;
    }

    /* Modal */
    .modal-content { background: #141414; border: 1px solid #2a2a2a; color: #e8e8e8; }
    .modal-header { border-bottom: 1px solid #222; }
    .btn-close { filter: invert(1) brightness(0.6); }
    .modal-title { font-size: 1.5rem; font-weight: 700; color: #e8e8e8; }
    .modal-meta { font-size: 0.75rem; color: #666; text-transform: uppercase; letter-spacing: 0.08em; }
    .section-label {
      font-size: 0.6rem;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: #555;
      font-weight: 600;
      margin-bottom: 0.5rem;
    }
    .ingredient-list { list-style: none; padding: 0; margin: 0; }
    .ingredient-list li {
      display: flex;
      gap: 0.6rem;
      padding: 0.35rem 0;
      border-bottom: 1px solid #1e1e1e;
      font-size: 0.88rem;
      color: #ccc;
    }
    .ingredient-list li:last-child { border-bottom: none; }
    .ingredient-list li.missing { color: #7a3a3a; text-decoration: line-through; }
    .ing-amount { color: #c8a96e; min-width: 2.5rem; flex-shrink: 0; font-variant-numeric: tabular-nums; }
    .method-text { font-size: 0.88rem; line-height: 1.8; color: #bbb; }
    .notes-text { font-size: 0.82rem; line-height: 1.75; color: #666; font-style: italic; }
    .missing-list { display: flex; flex-wrap: wrap; gap: 0.3rem; margin-top: 0.4rem; }
    .missing-tag {
      font-size: 0.7rem;
      padding: 0.15rem 0.5rem;
      border: 1px solid #3a1a1a;
      color: #8b4444;
      text-transform: uppercase;
      letter-spacing: 0.06em;
    }
    hr { border-color: #222; }

    /* Serves toggle */
    .serves-toggle { gap: 0.3rem; font-size: 0.72rem; color: #666; letter-spacing: 0.08em; text-transform: uppercase; }
    .serves-btn {
      width: 30px; height: 30px;
      border: 1px solid #333;
      background: #1a1a1a;
      color: #666;
      font-size: 0.8rem;
      cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      transition: all 0.12s;
    }
    .serves-btn:hover { border-color: #c8a96e; color: #c8a96e; }
    .serves-btn.active { border-color: #c8a96e; color: #c8a96e; background: rgba(200,169,110,0.1); }

    #no-results { display: none; color: #555; }
    #loading { color: #555; }
    #search { max-width: 280px; }
    .modal-dialog-cocktail { max-width: 560px; }
  </style>
</head>
<body>

<!-- Navbar -->
<nav class="navbar sticky-top navbar-dark shadow-sm">
  <div class="container-fluid gap-2">
    <a class="navbar-brand" href="/">
      <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" class="me-1 mb-1" viewBox="0 0 16 16">
        <path d="M8.354 1.146a.5.5 0 0 0-.708 0l-6 6A.5.5 0 0 0 1.5 7.5v7a.5.5 0 0 0 .5.5h4.5v-4h3v4H14a.5.5 0 0 0 .5-.5v-7a.5.5 0 0 0-.146-.354L13 5.793V2.5a.5.5 0 0 0-.5-.5h-1a.5.5 0 0 0-.5.5v1.293L8.354 1.146z"/>
      </svg>
      Jack Dunstan
    </a>
    <span class="navbar-text fw-semibold">Cocktails</span>
    <a class="btn btn-sm btn-outline-light ms-3" href="/recipes/">Recipes →</a>
    <input id="search" class="form-control form-control-sm ms-auto" type="search" placeholder="Search cocktails or spirits…" aria-label="Search">
  </div>
</nav>

<!-- Filter bar -->
<div class="filter-bar d-flex flex-wrap align-items-center px-3 py-2">
  <button type="button" class="btn btn-sm btn-filter btn-filter-active" data-filter="all">All</button>
  <button type="button" class="btn btn-sm btn-filter" data-filter="available">Can Make</button>
  <button type="button" class="btn btn-sm btn-filter" data-filter="stirred">Stirred</button>
  <button type="button" class="btn btn-sm btn-filter" data-filter="straight-up">Straight Up</button>
  <button type="button" class="btn btn-sm btn-filter" data-filter="on-the-rocks">On the Rocks</button>
  <button type="button" class="btn btn-sm btn-filter" data-filter="built">Built</button>
  <div class="ms-auto d-flex align-items-center serves-toggle">
    Serves
    <button type="button" class="serves-btn active ms-1" data-serves="1" id="serves-1">1</button>
    <button type="button" class="serves-btn" data-serves="2" id="serves-2">2</button>
  </div>
  <span id="cocktail-count" class="ms-3 count-badge"></span>
</div>

<!-- Grid -->
<div class="container-fluid py-4 px-4">
  <div id="loading" class="text-center py-5">Loading cocktails…</div>
  <div id="no-results" class="text-center py-5">No cocktails match.</div>
  <div class="row g-3" id="grid"></div>
</div>

<!-- Modal -->
<div class="modal fade" id="cocktailModal" tabindex="-1" aria-labelledby="cocktailModalLabel" aria-hidden="true">
  <div class="modal-dialog modal-dialog-scrollable modal-dialog-cocktail">
    <div class="modal-content">
      <div class="modal-header">
        <h2 class="modal-title" id="cocktailModalLabel"></h2>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
      </div>
      <div id="modal-body" class="modal-body"></div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script>
const COCKTAIL_FILES = [
  'black-manhattan',
  'boulevardier',
  'corpse-reviver-2',
  'french-75',
  'jungle-bird',
  'kingston-negroni',
  'last-word',
  'mai-tai',
  'manhattan',
  'margarita-rocks',
  'margarita-straight-up',
  'mezcal-negroni',
  'mojito',
  'negroni',
  'old-fashioned',
  'paper-plane',
  'sazerac',
  'sidecar',
  'vesper',
  'white-lady',
];

// ── Parser ───────────────────────────────────────────────────────────────────

function parseFrontmatter(text) {
  const match = text.match(/^---\n([\s\S]*?)\n---\n?([\s\S]*)$/);
  if (!match) return { meta: {}, body: text };
  const [, fmText, body] = match;
  const meta = {};
  fmText.split('\n').forEach(line => {
    const idx = line.indexOf(':');
    if (idx === -1) return;
    const key = line.slice(0, idx).trim();
    const raw = line.slice(idx + 1).trim();
    if (!raw) { meta[key] = null; return; }
    try { meta[key] = JSON.parse(raw); } catch { meta[key] = raw; }
  });
  return { meta, body };
}

function parseSections(body) {
  const sections = {};
  let current = null;
  for (const line of body.split('\n')) {
    const h2 = line.match(/^##\s+(.*)/);
    if (h2) { current = h2[1].trim().toLowerCase(); sections[current] = []; continue; }
    if (line.match(/^#\s+/)) continue;
    if (current) sections[current].push(line);
  }
  for (const arr of Object.values(sections)) {
    while (arr.length && arr[0].trim() === '') arr.shift();
    while (arr.length && arr[arr.length - 1].trim() === '') arr.pop();
  }
  return sections;
}

// Extract amount + name from a line like "30ml gin" or "2 dashes angostura bitters"
function parseIngredientLine(line) {
  line = line.replace(/^-\s+/, '').trim();
  const m = line.match(/^([\d.]+\s*(?:ml|cl|oz|dashes?|dash|tsp|tbsp|bar\s*spoon|leaves?|parts?|splash)?)\s+(.*)/i);
  if (m) return { amount: m[1].trim(), name: m[2].trim() };
  return { amount: '', name: line };
}

function parseCocktail(text, slug) {
  const { meta, body } = parseFrontmatter(text);
  const sections = parseSections(body);

  const ingredients = (sections['ingredients'] || [])
    .filter(l => l.trim().startsWith('-'))
    .map(l => parseIngredientLine(l));

  const method = (sections['method'] || []).join(' ').trim();
  const notes = (sections['notes'] || []).map(l => l.replace(/^-\s+/, '')).filter(Boolean).join(' ');

  return {
    slug,
    name: meta.cocktail_name || '',
    style: meta.style || '',
    glass: meta.glass || '',
    garnish: meta.garnish || '',
    ingredients,
    method,
    notes,
  };
}

// ── Inventory ────────────────────────────────────────────────────────────────

let INVENTORY = new Set();

function parseInventory(md) {
  INVENTORY.clear();
  for (const line of md.split('\n')) {
    const item = line.replace(/^[-*]\s+/, '').trim().toLowerCase();
    if (item && !item.startsWith('#') && item.length > 1) INVENTORY.add(item);
  }
}

function hasItem(name) {
  const n = name.toLowerCase().trim();
  if (INVENTORY.has(n)) return true;
  for (const item of INVENTORY) {
    if (n.includes(item) || item.includes(n)) return true;
  }
  return false;
}

function getMissing(cocktail) {
  return cocktail.ingredients.filter(i => i.name && !hasItem(i.name));
}

function canMake(cocktail) {
  return getMissing(cocktail).length === 0;
}

// ── State ────────────────────────────────────────────────────────────────────

let ALL_COCKTAILS = [];
let activeFilter = 'all';
let searchQuery = '';
let currentServes = 1;
let openSlug = null;

// ── Filtering ────────────────────────────────────────────────────────────────

function getFiltered() {
  return ALL_COCKTAILS.filter(c => {
    if (activeFilter === 'available' && !canMake(c)) return false;
    if (['stirred', 'straight-up', 'on-the-rocks', 'built'].includes(activeFilter) && c.style !== activeFilter) return false;
    if (searchQuery) {
      const q = searchQuery.toLowerCase();
      const haystack = c.name.toLowerCase() + ' ' + c.ingredients.map(i => i.name).join(' ').toLowerCase();
      if (!haystack.includes(q)) return false;
    }
    return true;
  });
}

// ── Render helpers ───────────────────────────────────────────────────────────

function styleLabel(style) {
  return { stirred: 'Stirred', 'straight-up': 'Straight Up', 'on-the-rocks': 'On the Rocks', built: 'Built' }[style] || style;
}

function scaleAmount(amountStr, serves) {
  if (serves === 1) return amountStr;
  return amountStr.replace(/([\d.]+)/g, (_, n) => {
    const scaled = parseFloat(n) * serves;
    return scaled % 1 === 0 ? String(scaled) : scaled.toFixed(1);
  });
}

// ── Grid ─────────────────────────────────────────────────────────────────────

function renderGrid() {
  const grid = document.getElementById('grid');
  const noResults = document.getElementById('no-results');
  const countEl = document.getElementById('cocktail-count');
  const filtered = getFiltered();

  countEl.textContent = `${filtered.length} cocktail${filtered.length !== 1 ? 's' : ''}`;
  grid.innerHTML = '';

  if (filtered.length === 0) { noResults.style.display = 'block'; return; }
  noResults.style.display = 'none';

  filtered.forEach(c => {
    const available = canMake(c);
    const missing = getMissing(c);
    const col = document.createElement('div');
    col.className = 'col-6 col-md-4 col-lg-3 col-xl-2';
    col.innerHTML = `
      <div class="card cocktail-card border-0${available ? '' : ' unavailable'}" data-slug="${c.slug}">
        <div class="card-body">
          <div class="card-title">${c.name}</div>
          <div class="card-meta mb-2">${c.glass} · ${styleLabel(c.style)}</div>
          ${available
            ? `<span class="badge-available">Can make</span>`
            : `<span class="badge-missing">${missing.length} missing</span>`}
        </div>
      </div>
    `;
    if (available) {
      col.querySelector('.cocktail-card').addEventListener('click', () => openModal(c.slug));
    }
    grid.appendChild(col);
  });
}

// ── Modal ────────────────────────────────────────────────────────────────────

function openModal(slug) {
  openSlug = slug;
  renderModalContent(slug);
  bootstrap.Modal.getOrCreateInstance(document.getElementById('cocktailModal')).show();
}

function renderModalContent(slug) {
  const c = ALL_COCKTAILS.find(x => x.slug === slug);
  if (!c) return;

  const missing = getMissing(c);
  const metaParts = [c.glass, styleLabel(c.style), c.garnish ? `Garnish: ${c.garnish}` : null].filter(Boolean);

  const ingredientsHTML = c.ingredients.map(i => {
    const isMissing = i.name && !hasItem(i.name);
    return `<li class="${isMissing ? 'missing' : ''}">
      <span class="ing-amount">${i.amount ? scaleAmount(i.amount, currentServes) : ''}</span>
      <span>${i.name}</span>
    </li>`;
  }).join('');

  document.getElementById('cocktailModalLabel').textContent = c.name;
  document.getElementById('modal-body').innerHTML = `
    <p class="modal-meta mb-3">${metaParts.join(' · ')}</p>
    <div class="section-label">Ingredients</div>
    <ul class="ingredient-list mb-4">${ingredientsHTML}</ul>
    ${c.method ? `
      <div class="section-label">Method</div>
      <p class="method-text mb-4">${c.method}</p>
    ` : ''}
    ${c.notes ? `
      <div class="section-label">Notes</div>
      <p class="notes-text mb-3">${c.notes}</p>
    ` : ''}
    ${missing.length > 0 ? `
      <hr>
      <div class="section-label">Missing from bar</div>
      <div class="missing-list">${missing.map(i => `<span class="missing-tag">${i.name}</span>`).join('')}</div>
    ` : ''}
  `;
}

// ── Controls ─────────────────────────────────────────────────────────────────

document.querySelectorAll('[data-filter]').forEach(btn => {
  btn.addEventListener('click', () => {
    activeFilter = btn.dataset.filter;
    document.querySelectorAll('[data-filter]').forEach(b => {
      b.classList.toggle('btn-filter-active', b.dataset.filter === activeFilter);
    });
    renderGrid();
  });
});

document.getElementById('search').addEventListener('input', e => {
  searchQuery = e.target.value.trim();
  renderGrid();
});

document.querySelectorAll('.serves-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    currentServes = parseInt(btn.dataset.serves);
    document.querySelectorAll('.serves-btn').forEach(b => {
      b.classList.toggle('active', parseInt(b.dataset.serves) === currentServes);
    });
    if (openSlug) renderModalContent(openSlug);
  });
});

document.getElementById('cocktailModal').addEventListener('hidden.bs.modal', () => {
  openSlug = null;
});

// ── Init ─────────────────────────────────────────────────────────────────────

async function init() {
  try {
    const [inventoryText, ...cocktailTexts] = await Promise.all([
      fetch('./ingredients.md').then(r => r.ok ? r.text() : '').catch(() => ''),
      ...COCKTAIL_FILES.map(slug =>
        fetch(`./${slug}.md`).then(r => r.ok ? r.text() : null).catch(() => null)
      )
    ]);

    parseInventory(inventoryText);

    ALL_COCKTAILS = cocktailTexts
      .map((text, i) => text ? parseCocktail(text, COCKTAIL_FILES[i]) : null)
      .filter(Boolean)
      .sort((a, b) => a.name.localeCompare(b.name));

    document.getElementById('loading').style.display = 'none';
    renderGrid();
  } catch (e) {
    document.getElementById('loading').textContent = 'Error loading cocktails — check console.';
    console.error(e);
  }
}

init();
</script>
</body>
</html>
